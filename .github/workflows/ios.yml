name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (FocusFlowPro)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(mdfind "kMDItemCFBundleIdentifier == 'com.apple.dt.Xcode'" | sort -r | head -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve scheme
        run: |
          echo "SCHEME=FocusFlowPro" >> $GITHUB_ENV
          echo "PROJECT=FocusFlowPro.xcodeproj" >> $GITHUB_ENV

      - name: Build for testing
        env:
          PLATFORM: "iOS Simulator"
        run: |
          # ищем первый доступный iPhone‑симулятор
          DEVICE=$(xcrun xctrace list devices 2>&1 \
            | grep -oE 'iPhone.*?[^\(]+' \
            | head -1 \
            | awk '{$1=$1;print}' \
            | sed -e "s/ Simulator$//")

          xcodebuild \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "platform=$PLATFORM,name=$DEVICE" \
            -configuration Debug \
            clean build-for-testing \
            | xcpretty

      - name: Run tests
        env:
          PLATFORM: "iOS Simulator"
        run: |
          DEVICE=$(xcrun xctrace list devices 2>&1 \
            | grep -oE 'iPhone.*?[^\(]+' \
            | head -1 \
            | awk '{$1=$1;print}' \
            | sed -e "s/ Simulator$//")

          xcodebuild \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "platform=$PLATFORM,name=$DEVICE" \
            -configuration Debug \
            test-without-building \
            | xcpretty
